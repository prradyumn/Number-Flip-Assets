<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Number Flip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="viewport">
  <div id="stage" aria-live="polite">
    <div id="world">
      <img id="bg" class="bg" src="assets/bg/bg-game-table.webp" alt="">
      <div id="tint"></div>

      <!-- top bar -->
      <div id="progress" aria-label="Progress" class="pill"></div>
      <button id="btnSound" class="iconbtn" aria-label="Sound on or off"><img src="assets/ui/ui-icon-sound-on.webp" alt=""></button>
      <button id="btnPause" class="iconbtn" aria-label="Pause"><img src="assets/ui/ui-icon-pause.webp" alt=""></button>


      <!-- characters + speech: Flippy voices every line, Robo is the computer player -->
      <div id="flippyWrap" class="charwrap"><img id="flippy" src="assets/characters/ch-flippy-idle.webp" alt="Flippy"></div>
      <div id="bubble" class="bubble"><img class="bubble-bg" src="assets/ui/ui-caption-bubble.webp" alt=""><span class="bubble-name">Flippy</span><p id="bubbleText"></p></div>
      <div id="roboWrap" class="charwrap"><img id="robo" src="assets/characters/ch-robo-idle.webp" alt="Computer"></div>
      <div id="roboFan"></div>

      <!-- table: draw pile, centre card, centre pile -->
      <button id="pile" aria-label="Draw pile">
        <img src="assets/cards/cd-back.webp" alt=""><img src="assets/cards/cd-back.webp" alt=""><img src="assets/cards/cd-back.webp" alt="">
      </button>
      <div id="centre"></div>
      <div id="ost" aria-live="polite"></div>
      <div id="equation"></div>

      <!-- card counts and the turn pointer -->
      <div id="cntYou" class="cnt"><span>YOU</span><b>8</b></div>
      <div id="cntCpu" class="cnt"><span>COMPUTER</span><b>8</b></div>
      <img id="turnPtr" src="assets/feedback/active-player-arrow.webp" alt="">

      <!-- learner hand -->
      <div id="hand"></div>

      <!-- one big action button: PLAY / NEXT -->
      <button id="btnGo" class="imgbtn" hidden><img src="assets/ui/ui-primary-button.webp" alt=""><span>PLAY</span></button>
      <div id="setupOpts" class="toggles" hidden><label class="toggle"><input type="checkbox" id="optVoice"><span class="knob"></span>Read lines aloud</label></div>
    </div>

    <div id="fxLayer"></div>
    <div id="stamp"><img src="assets/ui/ui-stamp-badge.webp" alt=""><span></span></div>

    <!-- row 1: game hook -->
    <section id="scrTitle" class="screen">
      <img class="bg" src="assets/bg/bg-magic-terrace.webp" alt="">
      <img class="rays" src="assets/fx/fx-win-rays.webp" alt="">
      <div class="title-plaque"><img src="assets/ui/ui-title-plaque.webp" alt=""><h1><span class="w1">NUMBER</span> <span class="w2"><i>F</i><i>L</i><i>I</i><i>P</i><i>!</i></span></h1></div>
      <p class="subtitle"></p>
      <div id="hookCards"></div>
      <img class="t-flippy" src="assets/characters/ch-flippy-talking.webp" alt="Flippy">
      <img class="t-robo" src="assets/characters/ch-robo-idle.webp" alt="Robo">
      <button id="btnSkipHook" class="skip-hook">Tap to skip ›</button>
    </section>

    <!-- teaching panel (observe) -->
    <section id="scrTeach" class="screen dim" hidden>
      <div class="panel reveal">
        <img class="panel-bg" src="assets/ui/ui-property-reveal-panel.webp" alt="">
        <img class="medal" src="" alt="">
        <p class="tag">Game rule</p>
        <h2></h2>
        <p class="how"></p>
        <div class="rule"></div>
      </div>
    </section>

    <!-- Part 3 row 20: property explanation -->
    <section id="scrExplain" class="screen dim" hidden>
      <div class="panel reveal explain">
        <img class="panel-bg" src="assets/ui/ui-property-reveal-panel.webp" alt="">
        <img class="medal" src="assets/rewards/medal-associative-unlocked.webp" alt="">
        <p class="tag">Property</p>
        <h2 class="pname">ASSOCIATIVE PROPERTY</h2>
        <div class="xrow big"><div class="xa"></div><div class="xval"></div></div>
        <div class="xrow small"><div class="xa"></div><div class="xval"></div></div>
        <p class="xcap"></p>
        <button class="imgbtn go" hidden><img src="assets/ui/ui-primary-button.webp" alt=""><span>GOT IT</span></button>
      </div>
    </section>

    <!-- pause -->
    <section id="scrPause" class="screen dim" hidden>
      <div class="panel pause">
        <img class="panel-bg" src="assets/ui/ui-round-result-panel.webp" alt="">
        <h2>Paused</h2>
        <button class="imgbtn" id="btnResume"><img src="assets/ui/ui-primary-button.webp" alt=""><span>RESUME</span></button>
        <button class="imgbtn" id="btnRestart"><img src="assets/ui/ui-secondary-button.webp" alt=""><span>RESTART</span></button>
        <div class="toggles small">
          <label class="toggle"><input type="checkbox" id="optVoice2"><span class="knob"></span>Read lines aloud</label>
        </div>
        <div class="jump"></div>
      </div>
    </section>

    <!-- Part 3 row 39: property completion -->
    <section id="scrWin" class="screen" hidden>
      <img class="bg" src="assets/bg/bg-victory.webp" alt="">
      <img class="rays" src="assets/fx/fx-win-rays.webp" alt="">
      <h2>ASSOCIATIVE COMPLETE!</h2>
      <div class="ring"></div>
      <div class="pcard"><img src="assets/cards/cd-front-associative.webp" alt=""><span>( a + b ) + c<br>=<br>a + ( b + c )</span></div>
      <div class="rating"></div>
      <button class="imgbtn" id="btnAgain"><img src="assets/ui/ui-primary-button.webp" alt=""><span>PLAY AGAIN</span></button>
      <button class="imgbtn" id="btnHome"><img src="assets/ui/ui-secondary-button.webp" alt=""><span>HOME</span></button>
    </section>

    <div id="qa" hidden><b>Jump to</b><div class="jump"></div></div>
  </div>
  <div id="rotate"><img src="assets/characters/ch-flippy-pointing.webp" alt=""><p>Turn your device sideways to play</p></div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="js/content.js"></script>
<script src="js/game.js"></script>
</body>
</html>
